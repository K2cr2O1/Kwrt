name: Build Kwrt x86_64 with AIC8800

on:
  workflow_dispatch:
    inputs:
      inject_aic:
        description: '注入 AIC8800 USB WiFi 驱动'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget jq
          echo "--- 工具版本 ---"
          gcc --version | head -1
          python3 --version

      - name: 克隆 OpenWrt 源码
        run: |
          git clone https://github.com/openwrt/openwrt -b openwrt-25.12 --depth 1 openwrt
          cd openwrt
          git log --oneline -1
          echo "内核版本: $(grep -m1 KERNEL_PATCHVER target/linux/x86/Makefile)"

      - name: 应用 Kwrt 配置
        run: |
          cd openwrt
          cp -rf ../devices/common/. ./
          cp -rf ../devices/x86_64/. ./
          cp -rf ../devices ./devices
          chmod +x devices/common/diy.sh
          bash devices/common/diy.sh
          cp -f devices/common/.config .config
          echo >> .config
          cat devices/x86_64/.config >> .config
          chmod +x devices/x86_64/diy.sh
          bash devices/x86_64/diy.sh

      - name: 注入 AIC8800 驱动
        if: ${{ github.event.inputs.inject_aic != 'false' }}
        run: |
          cd openwrt
          echo "=== 拉取驱动包 ==="
          git clone --depth 1 https://github.com/kasonhaimen/openwrt-aic8800dc /tmp/aic
          cp -r /tmp/aic/package/kernel/aic8800dc package/kernel/
          if [ -d /tmp/aic/package/utils/usbmode ]; then
            cp -r /tmp/aic/package/utils/usbmode package/utils/
            echo "已加入 usbmode"
          fi
          echo "=== 包内容 ==="
          ls package/kernel/aic8800dc/
          echo "=== 选中包 ==="
          cat >> .config <<'EOF'
          CONFIG_USB_SUPPORT=y
          CONFIG_DRIVER_11AX_SUPPORT=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_kmod-mac80211=m
          CONFIG_PACKAGE_kmod-aic8800dc=m
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          EOF

      - name: 应用补丁
        run: |
          cd openwrt
          cp -rn devices/common/patches devices/x86_64/ 2>/dev/null || true
          find "devices/x86_64/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 \
            | sort -z | xargs -0 -r -I % sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/x86_64/patches" -maxdepth 1 -type f -name '*.patch' \
            ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 \
            | sort -z | xargs -0 -r -I % sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: 生成配置并检查驱动
        run: |
          cd openwrt
          make defconfig
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_PACKAGE_kmod-aic8800dc|CONFIG_PACKAGE_usb-modeswitch|CONFIG_TARGET_x86_64|CONFIG_GRUB_EFI_IMAGES" .config || true
          if ! grep -q "CONFIG_PACKAGE_kmod-aic8800dc=y" .config && ! grep -q "CONFIG_PACKAGE_kmod-aic8800dc=m" .config; then
            echo "::error::AIC8800 驱动未被选中，检查 DEPENDS 是否满足"
            exit 1
          fi

      - name: 下载软件包源码
        run: |
          cd openwrt
          make -j$(nproc) download V=s 2>&1 | tail -30 || true

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tail -120

      - name: 检查产物
        run: |
          cd openwrt
          echo "=== 固件 ==="
          ls -lh bin/targets/x86/64/*.img.gz 2>/dev/null || echo "无固件产物"
          echo "=== AIC 驱动 ipk ==="
          find bin -name "*aic8800*.ipk" -exec ls -lh {} \; 2>/dev/null || echo "无 aic ipk"

      - name: 上传固件与驱动
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-x86_64-aic
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/packages/*aic8800*.ipk
          if-no-files-found: warn
          retention-days: 7
